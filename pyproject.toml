[project]
name = "a-ponte"
version = "1.0.0"
description = "Agente A2A (Central de Salas) com um servidor MCP por dentro: desafio A Ponte."
readme = "README.md"
# Python 3.10 ou superior, como pede o enunciado (e o minimo do mcp 2.3.0).
requires-python = ">=3.10"
# Versoes travadas. Sem SDK de LLM: o agente decide por regra.
dependencies = [
    "mcp==2.3.0",         # SDK oficial do MCP v2 (revisao 2026-07-28): servidor MCP
    "uvicorn==0.54.0",    # servidor ASGI dos dois processos
    "starlette==1.7.0",   # HTTP do agente A2A (card + JSON-RPC)
    "httpx2==2.14.0",     # cliente HTTP do host MCP dentro do agente
]

[tool.uv]
package = false
